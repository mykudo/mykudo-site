<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mykudo — Gyroscope médaillon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #05081c;
    --bg-glow: #0a1358;
    --indigo: #4f6bff;
    --cyan: #38e1ff;
    --bronze: #b48240;
    --silver: #bec6d7;
    --gold: #ffd666;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg-deep);
    color: #eef1ff;
    overflow-x: hidden;
  }
  .hero {
    position: relative;
    height: 100vh;
    width: 100%;
    background: radial-gradient(ellipse 90% 70% at 68% 45%, var(--bg-glow) 0%, var(--bg-deep) 70%);
    overflow: hidden;
  }
  #scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .overlay {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 3rem 5vw;
    pointer-events: none;
  }
  .brand {
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.28em;
    color: #eef1ff;
  }
  .brand .dot { color: var(--cyan); }
  .content {
    margin-top: auto;
    margin-bottom: auto;
    max-width: 620px;
  }
  h1 {
    font-size: clamp(2.4rem, 4.6vw, 4.1rem);
    line-height: 1.08;
    font-weight: 700;
    letter-spacing: -0.015em;
    background: linear-gradient(100deg, var(--indigo) 5%, #7f9dff 45%, var(--cyan) 95%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 60px rgba(79, 107, 255, 0.25);
  }
  .sub {
    margin-top: 1.4rem;
    font-size: clamp(1rem, 1.4vw, 1.2rem);
    color: #a7b1d6;
    max-width: 460px;
    line-height: 1.55;
  }
  .cta {
    pointer-events: auto;
    margin-top: 2.4rem;
    display: inline-block;
    width: fit-content;
    padding: 0.95rem 2.1rem;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: #05081c;
    background: linear-gradient(100deg, var(--cyan), #7f9dff);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 0 32px rgba(56, 225, 255, 0.35), inset 0 0 0 1px rgba(255,255,255,0.25);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 44px rgba(56, 225, 255, 0.5), inset 0 0 0 1px rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
<section class="hero">
  <canvas id="scene"></canvas>
  <div class="overlay">
    <div class="brand">MYKUDO<span class="dot">.</span></div>
    <div class="content">
      <h1>Vos plateformes IA, Data &amp; Cloud.<br>Conçues pour la production.</h1>
      <p class="sub">Architecture, gouvernance et industrialisation de vos données — avec la précision d'un instrument de mesure.</p>
      <button class="cta">Discutons de votre projet</button>
    </div>
  </div>
</section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 9);

// ---------- lumières ----------
scene.add(new THREE.AmbientLight(0x223066, 1.2));
const keyLight = new THREE.PointLight(0x8fa4ff, 60, 40);
keyLight.position.set(4, 5, 6);
scene.add(keyLight);
const cyanLight = new THREE.PointLight(0x38e1ff, 30, 30);
cyanLight.position.set(-3, -2, 4);
scene.add(cyanLight);

// ---------- groupe gyroscope, décalé à droite ----------
const gyro = new THREE.Group();
gyro.position.set(2.6, 0, 0);
scene.add(gyro);
const tilt = new THREE.Group(); // incliné par la souris
gyro.add(tilt);

// texture ronde douce pour les particules
function discTexture(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, color);
  g.addColorStop(0.4, color);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
}
const cyanDisc = discTexture('rgba(120,235,255,1)');
const whiteDisc = discTexture('rgba(255,255,255,1)');

// ---------- construction d'un anneau instrumenté ----------
function makeRing({ radius, tube, color, glowColor, tickCount, segCount }) {
  const group = new THREE.Group();

  // anneau métallique fin, doublé d'un filet intérieur (look instrument)
  const torus = new THREE.Mesh(
    new THREE.TorusGeometry(radius, tube, 24, 220),
    new THREE.MeshStandardMaterial({
      color, metalness: 0.85, roughness: 0.35,
      emissive: color, emissiveIntensity: 0.25,
    })
  );
  group.add(torus);
  const innerRail = new THREE.Mesh(
    new THREE.TorusGeometry(radius - 0.038, tube * 0.4, 12, 180),
    new THREE.MeshBasicMaterial({
      color: glowColor, transparent: true, opacity: 0.16,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  group.add(innerRail);

  // graduations : traits radiaux courts et nets, côté intérieur
  const tickPos = [];
  for (let i = 0; i < tickCount; i++) {
    const a = (i / tickCount) * Math.PI * 2;
    const long = i % 5 === 0 ? 0.05 : 0.025;
    const r1 = radius - tube - 0.015;
    const r0 = r1 - long;
    tickPos.push(Math.cos(a) * r0, Math.sin(a) * r0, 0);
    tickPos.push(Math.cos(a) * r1, Math.sin(a) * r1, 0);
  }
  const tickGeo = new THREE.BufferGeometry();
  tickGeo.setAttribute('position', new THREE.Float32BufferAttribute(tickPos, 3));
  const ticks = new THREE.LineSegments(tickGeo,
    new THREE.LineBasicMaterial({ color: glowColor, transparent: true, opacity: 0.4 }));
  group.add(ticks);

  // segments lumineux : fins arcs brillants incrustés dans l'anneau
  const segGroup = new THREE.Group();
  for (let i = 0; i < segCount; i++) {
    const start = (i / segCount) * Math.PI * 2 + 0.15;
    const arcLen = Math.PI * 2 / segCount * 0.32;
    const curve = new THREE.EllipseCurve(0, 0, radius, radius, start, start + arcLen);
    const pts = curve.getPoints(24).map(p => new THREE.Vector3(p.x, p.y, 0));
    const seg = new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, tube * 1.05, 8, false),
      new THREE.MeshBasicMaterial({
        color: glowColor, transparent: true, opacity: 0.6,
        blending: THREE.AdditiveBlending, depthWrite: false,
      })
    );
    segGroup.add(seg);
  }
  group.add(segGroup);

  // éclair : arc brillant qui parcourt l'anneau, invisible la plupart du temps
  const boltCurve = new THREE.EllipseCurve(0, 0, radius, radius, 0, Math.PI * 0.35);
  const boltPts = boltCurve.getPoints(30).map(p => new THREE.Vector3(p.x, p.y, 0));
  const bolt = new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(boltPts), 30, tube * 1.9, 8, false),
    new THREE.MeshBasicMaterial({
      color: glowColor, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false,
    })
  );
  group.add(bolt);

  // micro-particules en orbite le long de l'anneau
  const orbCount = 26;
  const orbAngles = new Float32Array(orbCount);
  const orbSpeeds = new Float32Array(orbCount);
  for (let i = 0; i < orbCount; i++) {
    orbAngles[i] = Math.random() * Math.PI * 2;
    orbSpeeds[i] = 0.25 + Math.random() * 0.35;
  }
  const orbGeo = new THREE.BufferGeometry();
  orbGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array(orbCount * 3), 3));
  const orbs = new THREE.Points(orbGeo, new THREE.PointsMaterial({
    size: 0.13, map: whiteDisc, color: 0xffffff,
    transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false, depthTest: false,
  }));
  orbs.renderOrder = 5;
  group.add(orbs);

  return { group, orbs, orbAngles, orbSpeeds, radius, bolt, boltState: { t: -1, next: 2 + Math.random() * 5 } };
}

const ringOuter = makeRing({ radius: 2.45, tube: 0.024, color: 0x8a5426, glowColor: 0xc98d4a, tickCount: 96, segCount: 6 });
const ringMid   = makeRing({ radius: 2.0, tube: 0.018, color: 0xaab4cc, glowColor: 0xdce8ff, tickCount: 72, segCount: 5 });
const ringInner = makeRing({ radius: 1.45, tube: 0.016, color: 0xf0bd3e, glowColor: 0xffe184, tickCount: 60, segCount: 4 });

// pivots : chaque anneau tourne autour d'un axe différent
const pivotOuter = new THREE.Group();
const pivotMid = new THREE.Group();
const pivotInner = new THREE.Group();
pivotOuter.add(ringOuter.group);
pivotMid.add(ringMid.group);
pivotInner.add(ringInner.group);
pivotOuter.rotation.set(0.42, 0, 0.08);
pivotMid.rotation.set(0.95, 0.35, 0);
pivotInner.rotation.set(0.25, 1.25, 0.1);
tilt.add(pivotOuter, pivotMid, pivotInner);

// ---------- cœur : sphère de particules cyan ----------
const coreCount = 1600;
const corePos = new Float32Array(coreCount * 3);
for (let i = 0; i < coreCount; i++) {
  // distribution en volume, plus dense au centre
  const r = 0.78 * Math.pow(Math.random(), 0.6);
  const th = Math.random() * Math.PI * 2;
  const ph = Math.acos(2 * Math.random() - 1);
  corePos[i * 3] = r * Math.sin(ph) * Math.cos(th);
  corePos[i * 3 + 1] = r * Math.sin(ph) * Math.sin(th);
  corePos[i * 3 + 2] = r * Math.cos(ph);
}
const coreGeo = new THREE.BufferGeometry();
coreGeo.setAttribute('position', new THREE.Float32BufferAttribute(corePos, 3));
const core = new THREE.Points(coreGeo, new THREE.PointsMaterial({
  size: 0.055, map: cyanDisc, color: 0x54e6ff,
  transparent: true, opacity: 0.9,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
tilt.add(core);

// noyau brillant au centre du cœur
const nucleus = new THREE.Sprite(new THREE.SpriteMaterial({
  map: cyanDisc, color: 0x9df2ff, transparent: true, opacity: 0.85,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
nucleus.scale.set(1.1, 1.1, 1);
tilt.add(nucleus);

// halo doux derrière le cœur
const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: cyanDisc, color: 0x1a9ed4, transparent: true, opacity: 0.45,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
halo.scale.set(2.6, 2.6, 1);
tilt.add(halo);

// ---------- étoiles d'ambiance ----------
const starCount = 250;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  starPos[i * 3] = (Math.random() - 0.5) * 30;
  starPos[i * 3 + 1] = (Math.random() - 0.5) * 18;
  starPos[i * 3 + 2] = -6 - Math.random() * 10;
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({
  size: 0.035, map: whiteDisc, color: 0x8fa4ff,
  transparent: true, opacity: 0.4, depthWrite: false,
})));

// ---------- interaction souris ----------
let mouseX = 0, mouseY = 0;
window.addEventListener('pointermove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
});

// ---------- resize ----------
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ---------- animation ----------
const clock = new THREE.Clock();
const rings = [ringOuter, ringMid, ringInner];
const pivots = [pivotOuter, pivotMid, pivotInner];
const spinSpeeds = [0.12, -0.18, 0.26];

function updateOrbits(ring, dt) {
  const arr = ring.orbs.geometry.attributes.position.array;
  for (let i = 0; i < ring.orbAngles.length; i++) {
    ring.orbAngles[i] += ring.orbSpeeds[i] * dt;
    arr[i * 3] = Math.cos(ring.orbAngles[i]) * ring.radius;
    arr[i * 3 + 1] = Math.sin(ring.orbAngles[i]) * ring.radius;
    arr[i * 3 + 2] = 0;
  }
  ring.orbs.geometry.attributes.position.needsUpdate = true;
}

function updateBolt(ring, dt, t) {
  const s = ring.boltState;
  if (s.t < 0) {
    s.next -= dt;
    if (s.next <= 0) { s.t = 0; }
    return;
  }
  s.t += dt;
  const dur = 0.9;
  if (s.t > dur) {
    s.t = -1;
    s.next = 1.5 + Math.random() * 3.5;
    ring.bolt.material.opacity = 0;
    return;
  }
  const p = s.t / dur;
  ring.bolt.rotation.z = p * Math.PI * 2.2 + t * 0.3;
  ring.bolt.material.opacity = Math.sin(p * Math.PI);
}

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // oscillation majestueuse d'ensemble (reste cadrée à droite)
  gyro.rotation.y = Math.sin(t * 0.16) * 0.32;
  gyro.rotation.x = Math.sin(t * 0.11) * 0.08;

  // inclinaison souris (lerp)
  tilt.rotation.x += (mouseY * 0.28 - tilt.rotation.x) * 0.04;
  tilt.rotation.y += (mouseX * 0.35 - tilt.rotation.y) * 0.04;

  // rotation propre de chaque anneau autour de son axe local
  for (let i = 0; i < 3; i++) {
    rings[i].group.rotation.z += spinSpeeds[i] * dt * 2.2;
    pivots[i].rotation.y += spinSpeeds[i] * dt * 0.5;
    updateOrbits(rings[i], dt);
    updateBolt(rings[i], dt, t);
  }

  // pulsation et lente rotation interne du cœur
  const pulse = 1 + Math.sin(t * 1.4) * 0.06;
  core.scale.setScalar(pulse);
  core.rotation.y += dt * 0.18;
  core.rotation.z += dt * 0.05;
  core.material.opacity = 0.75 + Math.sin(t * 1.4) * 0.12;
  halo.material.opacity = 0.42 + Math.sin(t * 1.4) * 0.1;

  renderer.render(scene, camera);
}

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reducedMotion) {
  frame();
} else {
  renderer.setAnimationLoop(frame);
}
</script>
</body>
</html>
